name: Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Deploy only happens on main. Pull requests build the site to catch breakage.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install MkDocs
        run: pip install -r scripts/requirements-site.txt
      - name: Generate pages from README and evidence
        run: python3 scripts/build_site.py
      - name: Build the site
        run: mkdocs build --strict -f site-build/mkdocs.yml
      - name: Configure Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
      - name: Upload artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site-build/site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
